name: Build and Test Node.js Library

on: [push, pull_request]

jobs:
  build-and-test:
    strategy:
      matrix:
        include:
          # - os: ubuntu-latest
          #   arch: x86_64
          # - os: macos-latest
          #   arch: aarch64
          - os: windows-latest
            arch: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      # Крок для отримання коду з репозиторію
      - uses: actions/checkout@v4

      # Налаштування Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Отримання поточної директорії
      - name: Get current directory
        run: echo "dir=$(pwd)" >> $GITHUB_ENV
        shell: bash

      # Встановлення залежностей
      - name: Install dependencies
        run: npm install

      # Додавання шляху до бібліотеки в PATH
      - name: Set PATH to include native library directory
        run: |
          echo "Adding ${{ env.dir }}\\native\\windows\\arm64 to PATH"
          set PATH=%PATH%;${{ env.dir }}\\native\\windows\\arm64
          echo %PATH%
        shell: cmd

      # Побудова та запуск тестів
      - name: Build and test
        run: |
          cargo build --target aarch64-pc-windows-msvc --release
          node test.js

