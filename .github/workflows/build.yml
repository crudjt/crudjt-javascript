name: Build and Test Node.js Library

on: [push, pull_request]

jobs:
  build-and-test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      # Крок для отримання коду з репозиторію
      - uses: actions/checkout@v4

      # Налаштування Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '12'

      - name: Install and build dependencies
        run: |
          npm install

      # Запуск тестів
      - name: Run tests
        working-directory: ./test-neon-package
        run: |
          mkdir node_modules
          ln -s $(pwd | sed 's/\/[^/]*$//') node_modules/crud_jt
          node test.js
