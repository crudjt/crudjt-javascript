name: Build and Test Node.js Library

on: [push, pull_request]

jobs:
  build-and-test:
    strategy:
      matrix:
        include:
          # - os: ubuntu-latest
          #   arch: x86_64
          # - os: macos-latest
          #   arch: aarch64
          - os: windows-latest
            arch: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      # Крок для отримання коду з репозиторію
      - uses: actions/checkout@v4

      # Налаштування Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Отримання поточної директорії
      - name: Get current directory
        run: echo "dir=$(pwd)" >> $GITHUB_ENV
        shell: bash

      # Встановлення залежностей
      - name: Install dependencies
        run: npm install

      - name: Copy DLL to System32
        run: |
          copy native\windows\x86_64\libstore_jt.dll C:\Windows\System32

      - name: Register DLL with regsvr32
        run: |
          regsvr32 /s C:\Windows\System32\libstore_jt.dll

      - name: Build Rust project
        run: npm run cargo-build -- --release

      - name: Run Node.js test
        run: node test.js

      # # Запуск тестів
